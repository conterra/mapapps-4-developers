  "postcss-selector-parser@6": "^6.1.3"
  "rollup@4": "^4.59.0"
  "serialize-javascript@6": "^7.0.5"
  "socket.io-parser": "^4.2.7"
  "underscore": "^1.13.8"
  "ws@8": "^8.21.0"
  "yaml@2": "^2.8.3"

onlyBuiltDependencies:
  - "esbuild"
  - "puppeteer"

ignoredBuiltDependencies:
  - "@vaadin/vaadin-usage-statistics"
  - "es5-ext"

# Needed for compatibility with old packages.
# This produces a legacy node_modules layout where every package can see every other package.
shamefullyHoist: true

linkWorkspacePackages: false

allowBuilds:
  esbuild: true
  puppeteer: true
  "@vaadin/vaadin-usage-statistics": false
  es5-ext: false