  "browserslist": "^4.28.7"
  "colord": "^2.9.4"
  "diff@4": "^4.0.4"
  "engine.io": "^6.6.7"
  "fast-uri": "^3.1.6"
  "flatted": "^3.4.2"
  "follow-redirects": "^1.16.0"
  "glob@10": "^10.5.0"
  "glob@11": "^11.1.0"
  "handlebars": "^4.7.9"
  "immutable@3": "^3.8.4"
